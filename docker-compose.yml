version: "3.8"

services:
  tasksentinel:
    build: .
    ports:
      - "3000:10000"
    environment:
      - PORT=10000
      - MONGODB_URL=mongodb+srv://user:password@cluster.mongodb.net/?appName=YourApp
      - MONGODB_DB_NAME=tasksentinel
      - SECRET_KEY=change-me-in-production
      - MONITOR_API_KEY=change-me-monitor-key
      - INTERNAL_API_URL=http://127.0.0.1:8001
    env_file:
      - .env
    restart: unless-stopped
