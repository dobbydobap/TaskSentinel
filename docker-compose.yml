services:
  tasksentinel:
    build: .
    ports:
      - "3000:10000"
    environment:
      - PORT=10000
      - MONGODB_URL=${MONGODB_URL:-mongodb://localhost:27017}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-tasksentinel}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - MONITOR_API_KEY=${MONITOR_API_KEY:-dev-monitor-key}
      - INTERNAL_API_URL=http://127.0.0.1:8001
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
